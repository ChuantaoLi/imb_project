# =============================================================================
# Benchmark Configuration for run_all.py
# =============================================================================
# 规则（每一项独立生效）：
#   - 不写该字段         → 自动发现全部
#   - 写 []              → 排除该类别，不运行任何
#   - 写 [a, b, ...]     → 只运行指定的
#
# CLI 参数 (--models, --datasets 等) 会覆盖 YAML 中的对应设置。
#
# Usage:
#   python run_all.py                        # use this config
#   python run_all.py --config my_conf.yaml  # use a different config
#   python run_all.py --models soup,spe      # CLI overrides config
# =============================================================================

# ---------------------------------------------------------------------------
# Models（MODEL_KEY 值，如 "soup", "DBCF", "mc_ccr"）
# [] 或不写 = 自动发现 Model/ 下所有模型
# ---------------------------------------------------------------------------
# models: []
models:
  - DDPM
  - DiagSelect
  - DMSAM-OAdB
  - EASS
  - HRIELM

# ---------------------------------------------------------------------------
# KEEL datasets（Dataset/KEEL/5fold/ 下的文件夹名）
# [] = 排除全部 KEEL；不写 = 自动发现全部
# ---------------------------------------------------------------------------
# datasets: []      # 排除 KEEL
# datasets:
#   - pima
#   - yeast
datasets: []

# ---------------------------------------------------------------------------
# Bearing datasets（Dataset/Bearing_IR/ 下）
# names: 数据集名 (CWRU, Gearbox, HUST, JNU, MFPT, Ottawa, SEU, XJTU)
# irs:   不平衡率 (5, 10, 20, 30)
# [] = 排除全部；不写 = 全部
# ---------------------------------------------------------------------------
bearing:
  names: []      # [] = 不运行任何 Bearing 数据集
  irs: []        # [] = 不运行任何 IR
# bearing:
#   names:
    # - CWRU
    # - Gearbox
    # - HUST
    # - JNU
    # - MFPT
    # - Ottawa
    # - SEU
    # - XJTU
  # irs:
    # - 30
  #   - 10

# ---------------------------------------------------------------------------
# Software Defect datasets（Dataset/Software/*.csv）
# names: 数据集名 (AR, CM, KC, MC)
# [] = 排除全部；不写 = 全部
# ---------------------------------------------------------------------------
software_defect:
  names: []      # [] = 不运行任何 Software Defect 数据集
# software_defect:
#   names:
#     - AR
#     - KC

# ---------------------------------------------------------------------------
# Heart datasets（Dataset/Heart/*.csv）
# names: 数据集名 (10Ydata, 7Ydata, Framingham, SPECTF)
# [] = 排除全部；不写 = 全部
# ---------------------------------------------------------------------------
heart:
  names: []      # [] = 不运行任何 Heart 数据集
# heart:
#   names:
#     - 10Ydata
#     - Framingham

# ---------------------------------------------------------------------------
# Run mode
#   smoke : 1 fold, smoke=True model configs — 快速验证
#   full  : 5 folds, paper-faithful model configs — 完整 benchmark
# ---------------------------------------------------------------------------
mode: full  # smoke | full

# Number of folds (null = auto: smoke→1, full→5)
n_folds: null

# Base random seed for reproducibility
base_seed: 42

# ---------------------------------------------------------------------------
# Output settings
# ---------------------------------------------------------------------------
output:
  # Output format: xlsx
  format: xlsx
  # Save confusion matrices as JSON in Result/ConfusionMatrices/
  save_cm: true
  # Output filename (null = auto: benchmark_results.xlsx / Smoke_Results.xlsx)
  file: null

# ---------------------------------------------------------------------------
# Model-specific parameter overrides (passed to build() as kwargs)
# Keys are MODEL_KEY values; values are dicts of build() parameter overrides.
# Parameters not listed here use the model's default values.
# ---------------------------------------------------------------------------
model_params:
  DDPM:
    diffusion_steps: 1000
    diffusion_epochs: 3000 # 修改
    classifier_epochs: 30 # 什么分类器
    max_generated_per_class: 30 # 什么意思
    device: torch
  DiagSelect:
    classifier: dt # 随机森林
    episodes: 10 # 修改
    max_selected_samples: 5000  # 什么意思
    backend: torch
  DMSAM-OAdB:
    n_estimators: 4
    epochs: 30
    device: torch
  EASS:
    classifier: dt
    episodes: 10
    n_estimators: 5
    hidden_dim: 50
    updates: 1
    backend: torch
  HRIELM:
    hidden_neurons: 256

# Active run selection for the requested experiment.  This block is last so
# it overrides the legacy commented/empty bearing example above.
bearing:
  names: [CWRU, Gearbox, HUST, JNU, MFPT, Ottawa, SEU, XJTU]
  irs: [30]
software_defect:
  names: []
heart:
  names: []
